server:
  port: 8081

spring:
  application:
    name: hotel-room-management

  datasource:
    url: jdbc:sqlserver://localhost:1435;databaseName=HotelRoomManagement;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    time-zone: America/Lima